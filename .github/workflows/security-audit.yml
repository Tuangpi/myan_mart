name: Security Audit

on:
  schedule:
    # Run at 00:00 UTC on the first day of January, April, July, and October.
    - cron: '0 0 1 */3 *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit high and critical dependency vulnerabilities
        run: npm audit --audit-level=high
